<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Club Elite 21</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script>
  (function () {
    try { document.documentElement.setAttribute('data-theme', localStorage.getItem('club21-theme') || 'light'); } catch (e) {}
  })();
</script>
</head>
<body>
<button class="icon-btn auth-theme" id="themeToggle" title="Toggle theme"></button>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand"><svg class="brand-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="bagG" x1="8" y1="20" x2="56" y2="60" gradientUnits="userSpaceOnUse"><stop stop-color="#e9c159"/><stop offset="1" stop-color="#b07d12"/></linearGradient><linearGradient id="starG" x1="18" y1="4" x2="46" y2="26" gradientUnits="userSpaceOnUse"><stop stop-color="#fff2cc"/><stop offset="1" stop-color="#e6b83f"/></linearGradient></defs><path d="M10 22h44l-4 34a4 4 0 0 1-4 3.6H18A4 4 0 0 1 14 56z" fill="url(#bagG)"/><path d="M22 26V19a10 10 0 0 1 20 0v7" stroke="#8a6210" stroke-width="3.4" stroke-linecap="round"/><path d="M14 40c8 4 14 5 20 3s12-5 20-3l-2.2 16a4 4 0 0 1-4 3.6H18A4 4 0 0 1 14 56z" fill="#f2d68e" opacity=".85"/><path d="M32 2l4.6 9.4 10.4 1.5-7.5 7.3 1.8 10.3L32 25.6l-9.3 4.9 1.8-10.3-7.5-7.3 10.4-1.5z" fill="url(#starG)"/></svg><span class="brand-text">Club Elite 21</span></div>
    <form data-auth="login" novalidate>
      <div class="field">
        <label for="email">Phone number</label>
        <input class="form-input" id="email" type="tel" inputmode="numeric" placeholder="Phone number" required autocomplete="tel">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-group">
          <input class="form-input" id="password" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="current-password">
          <button class="toggle-pass" type="button" aria-label="Show password"></button>
        </div>
      </div>
      <div class="auth-row">
        <label class="form-check"><input type="checkbox" checked> Remember me</label>
        <a href="javascript:void(0)" data-forgot>Forgot password?</a>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>

    <p class="auth-foot">New on our platform? <a href="register.html">Create an account</a></p>
  </div>
</div>
<script src="assets/js/icons.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
<script src="https://plugin-code.salesmartly.com/js/project_817643_847406_1788056247.js"></script>
