<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | Club21 Mall</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script>
  (function () {
    try { document.documentElement.setAttribute('data-theme', localStorage.getItem('club21-theme') || 'light'); } catch (e) {}
  })();
</script>
</head>
<body>
<button class="icon-btn auth-theme" id="themeToggle" title="Toggle theme"></button>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand"><svg class="brand-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="bagG" x1="8" y1="20" x2="56" y2="60" gradientUnits="userSpaceOnUse"><stop stop-color="#3B82F6"/><stop offset="1" stop-color="#1E40AF"/></linearGradient><linearGradient id="starG" x1="18" y1="4" x2="46" y2="26" gradientUnits="userSpaceOnUse"><stop stop-color="#FDE047"/><stop offset="1" stop-color="#F59E0B"/></linearGradient></defs><path d="M10 22h44l-4 34a4 4 0 0 1-4 3.6H18A4 4 0 0 1 14 56z" fill="url(#bagG)"/><path d="M22 26V19a10 10 0 0 1 20 0v7" stroke="#1E3A8A" stroke-width="3.4" stroke-linecap="round"/><path d="M14 40c8 4 14 5 20 3s12-5 20-3l-2.2 16a4 4 0 0 1-4 3.6H18A4 4 0 0 1 14 56z" fill="#22C55E" opacity=".85"/><path d="M32 2l4.6 9.4 10.4 1.5-7.5 7.3 1.8 10.3L32 25.6l-9.3 4.9 1.8-10.3-7.5-7.3 10.4-1.5z" fill="url(#starG)"/></svg><span class="brand-text"><b>Club21</b><span>Mall</span></span></div>
    <h1 class="auth-title">Adventure starts here &#127881;</h1>
    <p class="auth-sub">Sign up with your mobile number and start earning commission on the orders you grab.</p>

    <form data-auth="register" novalidate>
      <div class="field">
        <label for="name">Username</label>
        <input class="form-input" id="name" type="text" placeholder="Choose a username" required>
      </div>
      <div class="field">
        <label for="email">Mobile number</label>
        <input class="form-input" id="email" type="tel" inputmode="numeric" placeholder="0300 1234567" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-group">
          <input class="form-input" id="password" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
          <button class="toggle-pass" type="button" aria-label="Show password"></button>
        </div>
      </div>
      <div class="field">
        <label for="inviter">Invited by</label>
        <input class="form-input" id="inviter" type="text" readonly>
      </div>
      <div class="auth-row">
        <label class="form-check"><input type="checkbox" required checked> I agree to the privacy policy &amp; terms</label>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Sign up</button>
    </form>

    <p class="auth-foot">Already have an account? <a href="login.html">Sign in instead</a></p>
  </div>
</div>
<script src="assets/js/icons.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
