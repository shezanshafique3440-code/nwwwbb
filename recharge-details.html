<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recharge Details | Club21 Mall</title>
<meta name="description" content="Club21 Mall admin dashboard — orders, withdraw and recharge requests, products and users.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script>
  /* apply the saved theme before first paint to avoid a flash */
  (function () {
    try {
      var t = localStorage.getItem('club21-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
      if (localStorage.getItem('club21-sidebar') === '1') {
        document.addEventListener('DOMContentLoaded', function () {
          document.body.classList.add('sidebar-collapsed');
        });
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
<div class="layout" data-page="recharge-details">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop"></div>

  <div class="content-wrapper">
    <header class="navbar" id="navbar"></header>

    <main class="content">
      <nav class="breadcrumb" id="breadcrumb" data-trail="Dashboard::index.html|Recharges::recharge-requests.html|Details"></nav>
      <div id="page"></div>
    </main>

    <footer class="footer" id="footer"></footer>
  </div>
</div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/table.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
